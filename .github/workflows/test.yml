name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Generate canonical formatting patch
        run: |
          gofmt -w .
          git diff --binary > gofmt.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-patch
          path: gofmt.patch
          retention-days: 1
      - name: Run core tests
        run: go test ./internal/...
      - name: Check frontend JavaScript
        run: node --check frontend/dist/app.js
