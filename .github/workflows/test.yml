name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run core tests
        run: go test ./internal/...
      - name: Check frontend JavaScript
        run: node --check frontend/dist/app.js
