name: Refresh Go dependency lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate verified go.mod and go.sum
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Format source and generate module lock files
        run: |
          find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -w
          go mod tidy
          go mod verify
          git diff --binary > github-generated.patch

      - name: Upload generated patch and module lock files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-module-lock
          path: |
            go.mod
            go.sum
            github-generated.patch
          if-no-files-found: error
          retention-days: 3
